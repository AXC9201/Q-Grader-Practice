<style>
:root{--bg:#f5f1e8;--card:#fff;--ink:#25231f;--muted:#6d675d;--line:#ddd5c8;--accent:#5d4932;--good:#17683a;--bad:#a3362f}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:820px;margin:auto;padding:18px} .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin:12px 0}
h1{font-size:1.75rem;margin:.1rem 0 .5rem} h2{font-size:1.25rem} .muted{color:var(--muted)} .row{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.progress{height:8px;background:#e8e1d6;border-radius:8px;overflow:hidden;margin:14px 0} #bar{height:100%;background:var(--accent);width:0}
button{font:inherit;border:1px solid #bdb3a4;background:white;border-radius:12px;padding:12px 15px;cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.option{width:100%;text-align:left;margin:7px 0} .option.selected{outline:3px solid #c5aa82} .hidden{display:none} .score{font-size:2.2rem;font-weight:750} .good{color:var(--good)} .bad{color:var(--bad)} .review{padding:15px 0;border-top:1px solid var(--line)} small{color:var(--muted)} 
@media(max-width:520px){main{padding:10px}.card{padding:17px}}
</style></head><body><main>
<section id="intro" class="card"><h1>Q Grader Practice Mock Exam</h1><p>94 questions based strictly on the shared course notes and exam/study material.</p><p class="muted">Answer choices are randomized each attempt. Your answers stay on your device only.</p>
<div style="margin:18px 0">
<strong>Show answers after each question?</strong><br>
<label><input type="radio" name="showAnswers" value="no" checked> No — exam mode</label><br>
<label><input type="radio" name="showAnswers" value="yes"> Yes — study mode</label>
</div><button id="start" class="primary">Start quiz</button></section>

<script>
const BANK=[{"q":"In the CVA framework taught in the course, green-coffee grading corresponds to which assessment?","o":["Physical Assessment","Descriptive Assessment","Affective Assessment","Extrinsic Assessment"],"a":0,"e":"Green grading corresponds to Physical Assessment."},{"q":"Which CVA assessment objectively describes perceived sensory attributes and their intensity?","o":["Affective Assessment","Extrinsic Assessment","Descriptive Assessment","Physical Assessment"],"a":2,"e":"Descriptive Assessment records sensory description and intensity."},{"q":"Which CVA assessment records subjective quality and preference?","o":["Affective Assessment","Physical Assessment","Descriptive Assessment","Extrinsic Assessment"],"a":0,"e":"Affective Assessment captures subjective quality and preference."},{"q":"Which statement best reflects specialty status under the CVA framework?","o":["Physical Assessment alone determines it","Descriptive Assessment alone determines it","Affective Assessment alone determines it","No single CVA assessment provides a universal pass/fail specialty threshold"],"a":3,"e":"The course material does not assign a universal specialty pass/fail threshold to one CVA assessment."},{"q":"Which sequence matches the cupping attribute order in the instructor material?","o":["Fragrance → Aroma → Flavor → Aftertaste → Acidity → Sweetness → Mouthfeel","Aroma → Fragrance → Flavor → Acidity → Sweetness → Aftertaste → Mouthfeel","Fragrance → Flavor → Aroma → Acidity → Mouthfeel → Sweetness → Aftertaste","Flavor → Aroma → Fragrance → Aftertaste → Sweetness → Acidity → Mouthfeel"],"a":0,"e":"The taught sequence is Fragrance, Aroma, Flavor, Aftertaste, Acidity, Sweetness, Mouthfeel."},{"q":"What does CATA stand for?","o":["Choose Aroma Type and Attribute","Check All That Apply","Coffee Attribute Tasting Assessment","Categorize Aroma, Taste and Acidity"],"a":1,"e":"CATA means Check All That Apply."},{"q":"Which descriptive-assessment element does NOT receive an intensity rating in the supplied study material?","o":["Aroma","Acidity","Mouthfeel","Main Taste"],"a":3,"e":"Main Taste is selected/described without an intensity rating."},{"q":"A Descriptive Assessment records aroma intensity as 14. How should this be interpreted?","o":["Low","Medium","High","Affective preference"],"a":2,"e":"In the supplied material, 14 represents high descriptive intensity."},{"q":"A Descriptive Assessment records acidity intensity as 8. How should this be interpreted?","o":["Low","Medium","High","Defective"],"a":1,"e":"An intensity of 8 is medium in the course examples."},{"q":"Which scale pairing is correct?","o":["Descriptive 9-point; Affective 15-point","Descriptive 15-point; Affective 9-point","Both 9-point","Both 15-point"],"a":1,"e":"Descriptive intensity uses 15 points; Affective quality/preference uses 9 points."},{"q":"During green grading, 12 Partial Black beans represent how many defect equivalents?","o":["3","4","6","12"],"a":1,"e":"Partial Black is 3 beans per defect equivalent: 12 ÷ 3 = 4."},{"q":"Ten Parchment beans represent how many defect equivalents?","o":["1","2","5","10"],"a":1,"e":"Parchment is 5 beans per defect equivalent: 10 ÷ 5 = 2."},{"q":"Twenty Slight Insect Damaged beans represent how many defect equivalents?","o":["1","2","4","20"],"a":1,"e":"Slight Insect Damage is 10 beans per defect equivalent: 20 ÷ 10 = 2."},{"q":"Which defect has multiple black insect holes and an equivalency of 5 beans per defect?","o":["Severe Insect Damage","Slight Insect Damage","Floater","Shell"],"a":0,"e":"Severe Insect Damage has multiple black holes and uses 5 beans per defect equivalent."},{"q":"Which defect is described as yellow-red mold powder and can contaminate other beans?","o":["Full Sour","Fungus Damaged","Dried Cherry / Pod","Hull / Husk"],"a":1,"e":"Fungus Damaged beans are associated with visible mold powder and possible contamination of neighboring beans."},{"q":"A bean remains conspicuously light after roasting because it was harvested before fully ripe. Which defect is this?","o":["Parchment","Withered","Immature / Unripe / Quaker","Floater"],"a":2,"e":"Immature/unripe beans may roast lighter and appear as quakers."},{"q":"Which defect is a raisin-like dried cherry with pulp remaining?","o":["Dried Cherry / Pod","Parchment","Shell","Full Sour"],"a":0,"e":"Dried Cherry / Pod is the raisin-like defect with dried pulp."},{"q":"Which defect is foreign material such as wood, stone or metal?","o":["Hull / Husk","Foreign Matter","Shell","Broken / Chipped / Cut"],"a":1,"e":"Foreign Matter includes wood, stones, metal and similar non-coffee material."},{"q":"Six Partial Sour beans, 15 Severe Insect Damaged beans and 10 Hull/Husk pieces equal how many total defect equivalents?","o":["6","7","8","31"],"a":1,"e":"6/3 = 2; 15/5 = 3; 10/5 = 2. Total = 7."},{"q":"According to the course notes, what deduction is associated with a taint?","o":["−1","−2","−3","−4"],"a":1,"e":"The notes associate a taint with −2."},{"q":"What deduction is associated with a fault?","o":["−1","−2","−3","−4"],"a":3,"e":"The notes associate a fault with −4."},{"q":"Which sample-roast duration is within the course standard?","o":["5 minutes","7 minutes","10 minutes","15 minutes"],"a":2,"e":"The course specifies 8–12 minutes."},{"q":"What are the stated sample-roast Agtron target references for whole and ground coffee?","o":["55 whole / 65 ground","58 whole / 63 ground","63 whole / 58 ground","65 whole / 55 ground"],"a":1,"e":"The notes specify about 58 whole bean and 63 ground, roughly ±1."},{"q":"Which cooling method follows the sample-roasting notes?","o":["Immediate air cooling","Water quenching","Slow cooling in the roaster","Cold-water immersion"],"a":0,"e":"Samples should be cooled immediately with air; water quenching is excluded."},{"q":"When should cupping occur after the sample roast according to the notes?","o":["Immediately","2–6 hours","8–24 hours","36–48 hours"],"a":2,"e":"The stated window is 8–24 hours after roasting."},{"q":"A sample roast is flat, has a baked-bread character, and poorly expresses sweetness and acidity. Which roast fault best fits?","o":["Light","Dark","Baked","Fast"],"a":2,"e":"Baked roasting is associated with insufficient heat over a long roast, flatness, and weak sweetness/acidity."},{"q":"A sample roast has charcoal, tar, smoky and burnt-sugar characteristics. Which fault best fits?","o":["Light","Dark","Baked","Fast"],"a":1,"e":"These are the instructor-note descriptors for a dark roast fault."},{"q":"Which sample-roast condition is associated with an Agtron number above 65 in the notes?","o":["Too light","Too dark","Baked","Correct target"],"a":0,"e":"The notes associate >65 with a roast that is too light."},{"q":"In the Le Nez du Café framework, floral and fruity aromas belong to which formation group?","o":["Enzymatic","Sugar Browning","Dry Distillation","Aromatic Taints"],"a":0,"e":"Floral and fruity aromas are grouped under Enzymatic formation."},{"q":"Nuts, caramel and chocolate are associated with which aroma-formation group?","o":["Enzymatic","Sugar Browning","Dry Distillation","Aromatic Taints"],"a":1,"e":"Sugar Browning includes Maillard/caramelization-derived nut, caramel and chocolate aromas."},{"q":"Pyrolytic/burnt, roasted and spicy aromas are associated with which formation group?","o":["Enzymatic","Sugar Browning","Dry Distillation","Aromatic Taints"],"a":2,"e":"Dry Distillation covers stronger thermal breakdown aromas."},{"q":"Defect aromas arising during production, drying, transportation and storage belong to which group?","o":["Enzymatic","Sugar Browning","Dry Distillation","Aromatic Taints"],"a":3,"e":"Aromatic Taints is the defect-aroma group."},{"q":"A roasted coffee becomes flat and flavorless after long-term storage as aromatic compounds escape. Which older defect term applies?","o":["Insipid","Vapid","Past Crop","Strawy"],"a":1,"e":"Vapid describes flat, flavorless roasted coffee after long storage and aroma loss through degassing."},{"q":"A green coffee develops an old, stale taste after long storage following harvest. Which term applies?","o":["New Crop","Past Crop","Acerbic","Green"],"a":1,"e":"Past Crop describes old/stale character from prolonged green-coffee storage."},{"q":"Brewed coffee held hot too long becomes sour, harsh and astringent. Which term applies?","o":["Acerbic","Woody","Grassy","Earthy"],"a":0,"e":"Acerbic is the term used in the instructor notes for this hot-holding defect."},{"q":"Which term describes a straw or dried-hay flavor associated with green-coffee storage and aging?","o":["Strawy","Vapid","Wild","Flat"],"a":0,"e":"Strawy is associated with dried-hay character during storage/aging."},{"q":"Which term describes woody aroma from long-term storage of green coffee?","o":["Earthy","Woody","Green","Baked"],"a":1,"e":"Woody is linked to prolonged green-coffee aging."},{"q":"For CVA cupping, how should coffee generally be ground?","o":["Much finer than espresso","Espresso-fine","Slightly coarser than typical paper-filter drip","Very coarse French-press grind only"],"a":2,"e":"The exam material specifies slightly coarser than typical paper-filter drip."},{"q":"At the standard 5.5 g/100 mL cupping ratio, how much coffee is needed for 350 g of water?","o":["17.5 g","18.25 g","19.25 g","20.5 g"],"a":2,"e":"350 × 5.5 / 100 = 19.25 g."},{"q":"What batch-brew ratio is recommended in the supplied CVA Descriptive Assessment material?","o":["45–50 g/L","50–55 g/L","55–60 g/L","65–70 g/L"],"a":2,"e":"The supplied exam material specifies 55–60 g/L."},{"q":"Which aroma-development family is formed through cellular respiration while the coffee tree and fruit grow?","o":["Sugar Browning","Dry Distillation","Enzymatic","Aromatic Taints"],"a":2,"e":"Enzymatic aromas are associated with development while the coffee plant and fruit grow."},{"q":"Which trio belongs to the Enzymatic aroma-development family?","o":["Nutty, caramel, chocolate","Floral, fruity, vegetative","Terpeny, spices, pyrolytic","Mold, soil, disinfection"],"a":1,"e":"Enzymatic: floral, fruity and vegetative."},{"q":"Nuts, caramel and chocolate belong to which aroma-development family?","o":["Enzymatic","Sugar Browning","Dry Distillation","Aromatic Taints"],"a":1,"e":"Sugar Browning includes nutty, caramel and chocolate aromas."},{"q":"What is the key mechanism behind Sugar Browning?","o":["Cellular respiration and ripening","Microbial fermentation during processing","Maillard reactions and caramelization during roasting","Thermal breakdown of coffee fiber"],"a":2,"e":"Sugar Browning is tied to Maillard reactions and caramelization during roasting."},{"q":"The descriptors terpeny, spices and pyrolytic belong to which aroma-development family?","o":["Enzymatic","Aromatic Taints","Sugar Browning","Dry Distillation"],"a":3,"e":"Dry Distillation includes terpeny, spice and pyrolytic/burnt characteristics."},{"q":"What most clearly distinguishes Dry Distillation from Sugar Browning?","o":["Dry Distillation occurs only after brewing","Dry Distillation relates to stronger thermal breakdown of coffee fiber","Sugar Browning happens while the cherry grows","Sugar Browning produces only defect aromas"],"a":1,"e":"Dry Distillation is associated with stronger thermal breakdown of coffee fiber."},{"q":"A sample roast takes 10 minutes, reaches approximately Agtron 58 whole bean and 63 ground, has no tipping or scorching, and is immediately air-cooled. How does it compare with the supplied standards?","o":["Roast time is too long","Ground Agtron is outside target","It meets the supplied parameters","It should be water-quenched"],"a":2,"e":"The supplied notes specify 8–12 minutes, about 58 whole/63 ground, no scorching/tipping, and air cooling."},{"q":"A sample roast has a baked-bread aroma, flat flavor, and poorly expressed sweetness and acidity. Which roast fault best fits?","o":["Fast","Baked","Dark","Light"],"a":1,"e":"Baked roast is associated with baked-bread aroma, flatness, and weak sweetness/acidity."},{"q":"A sample roast has charcoal, tar, smoky and burnt-sugar characteristics. Which roasting problem best fits?","o":["Dark","Baked","Fast","Light"],"a":0,"e":"Those characteristics indicate a dark roast fault."},{"q":"A sample is excessively bright, sour and grain-like, with Agtron above 65. Which roast problem best fits?","o":["Baked","Fast","Light","Dark"],"a":2,"e":"Agtron above 65 and bright/sour/grain-like character indicate a light roast."},{"q":"Why can an excessively fast sample roast produce poor aroma development?","o":["Beans absorb excessive atmospheric moisture","There is insufficient time for the required chemical transformations","Enzymatic reactions restart inside the bean","Coffee undergoes excessive green-bean fermentation"],"a":1,"e":"A fast roast limits time for moisture evaporation, Maillard reactions and caramelization."},{"q":"During green grading, 9 Partial Black beans equal how many defect equivalents?","o":["1","3","6","9"],"a":1,"e":"Partial Black is 1/3 defect each: 9 × 1/3 = 3."},{"q":"Which listed green-coffee defect has an equivalency of one bean = one full defect?","o":["Parchment","Partial Sour","Full Sour","Slight Insect Damage"],"a":2,"e":"Full Sour has a defect coefficient of 1."},{"q":"During green grading, 15 Parchment beans equal how many defect equivalents?","o":["1","3","5","15"],"a":1,"e":"Parchment is 1/5 each: 15 × 1/5 = 3."},{"q":"Which description identifies Fungus Damaged green coffee?","o":["White or faded shell remaining on the bean","Reddish-brown discoloration","Yellow-red mold powder","Raisin-like dried pulp"],"a":2,"e":"Fungus Damaged beans are identified by yellow-red mold powder."},{"q":"A green coffee bean is partially reddish-brown because of fermentation and microbial infiltration during harvesting or processing. Which defect is it?","o":["Partial Black","Partial Sour","Dried Cherry / Pod","Fungus Damaged"],"a":1,"e":"Partial Sour is partially reddish-brown and associated with fermentation/microbial infiltration."},{"q":"In the supplied defect-cupping notes, what deduction is associated with one taint?","o":["−1","−2","−4","−5"],"a":1,"e":"A taint carries a −2 deduction."},{"q":"In the supplied defect-cupping notes, what deduction is associated with one fault?","o":["−1","−2","−4","−8"],"a":2,"e":"A fault carries a −4 deduction."},{"q":"The eight Affective Assessment scores total 53, which the supplied table converts to 87.50. There is 1 non-uniform cup and 1 defective cup. What is the final score?","o":["85.50","83.50","81.50","87.50"],"a":2,"e":"87.50 − 2 − 4 = 81.50."},{"q":"Which statement matches the 2021 SCA definition of specialty coffee used in the course material?","o":["Coffee scoring 80 points or higher on a universal quality scale","Coffee or a coffee experience recognized for distinctive attributes, resulting in higher marketplace value","Arabica coffee free from Category 1 defects","Coffee with exceptional acidity, sweetness and aroma"],"a":1,"e":"The course definition centers on recognized distinctive attributes resulting in higher value within the marketplace."},{"q":"Which set lists the three factors cited in the course material for development of CVA?","o":["Community utility, transparency in value judgments for specific buyers, consistency with sensory science","Roast color, green grade, cup score","Origin, variety, processing method","Price, certification, producer reputation"],"a":0,"e":"The study sheet identifies community utility, transparency in value judgments for specific buyers, and consistency with sensory science."},{"q":"Which list contains the Main Taste categories in the supplied Descriptive Assessment material?","o":["Sweet, sour, salty, bitter, umami","Sweet, sour, floral, fruity, bitter","Salty, spicy, bitter, sweet, metallic","Sour, sweet, nutty, cocoa, umami"],"a":0,"e":"The Main Taste list is salty, bitter, sour, umami and sweet."},{"q":"When are freely elicited descriptors appropriate in the supplied study material?","o":["Only when no CATA categories exist","When a specific descriptor corresponds to a general category, or a very clear descriptor is not represented by a category","Only during Physical Assessment","Only for negative attributes"],"a":1,"e":"The material allows freely elicited descriptors for specific descriptors under a general category or clear descriptors not represented by a category."},{"q":"Which is an intrinsic coffee attribute?","o":["Producer name","Processing method","Roasted-coffee flavor","Certification"],"a":2,"e":"Flavor is intrinsic because it is a property perceived from the coffee itself."},{"q":"Which is an extrinsic coffee attribute?","o":["Acidity intensity","Mouthfeel","Producer name","Roasted aroma"],"a":2,"e":"Producer information is extrinsic rather than a directly perceived sensory property."},{"q":"Which set belongs on the Extrinsic Assessment form according to the supplied material?","o":["Certificate, Trade, Processing, Farm Information","Flavor, Aftertaste, Acidity, Mouthfeel","Moisture, Size, Color, Defects","Fragrance, Aroma, Sweetness, Overall"],"a":0,"e":"The study material lists Certificate, Trade, Processing and Farm Information among Extrinsic categories."},{"q":"Extrinsic attributes can be useful to a buyer because they can serve as what?","o":["A replacement for cupping","An initial purchasing filter","A measure of descriptive intensity","A physical defect coefficient"],"a":1,"e":"The study material notes that extrinsic information can act as an initial filter when purchasing."},{"q":"How is flavor defined in the supplied written-exam material?","o":["Taste only","Aroma smelled before brewing","Perception combining taste and retronasal olfaction while coffee is in the mouth","Tactile weight and viscosity"],"a":2,"e":"Flavor combines gustatory perception with the retronasal olfactory component while the brew is in the mouth."},{"q":"What does mouthfeel refer to in the supplied material?","o":["Only the weight of the beverage","Tactile perception including weight, viscosity, texture and other tactile properties","Only drying sensation","Aroma remaining after swallowing"],"a":1,"e":"Mouthfeel is the tactile perception of the coffee, including weight, viscosity and texture."},{"q":"Odor molecules can reach the olfactory epithelium by how many routes in the supplied material?","o":["One","Two","Three","Four"],"a":1,"e":"The written-exam material identifies two routes to the olfactory epithelium."},{"q":"Smelling the dry grounds before water is added primarily uses which olfactory route?","o":["Retronasal","Orthonasal","Gustatory","Tactile"],"a":1,"e":"Odors entering through the nose during smelling are perceived orthonasally."},{"q":"Aroma reaching the olfactory system from the mouth during tasting is called what?","o":["Orthonasal olfaction","Retronasal olfaction","Tactile perception","Main Taste"],"a":1,"e":"Aroma traveling from the mouth toward the olfactory epithelium during tasting is retronasal."},{"q":"Which item is NOT a cupping sensory section in the supplied written-exam material?","o":["Flavor","Mouthfeel","Bean size","Aftertaste"],"a":2,"e":"Bean size belongs to Physical Assessment rather than the cupping sensory sections."},{"q":"After all crusts have been broken during cupping, what should happen before liquoring?","o":["Add more water","Skim grounds and oils from the surface","Regrind the coffee","Score Overall immediately"],"a":1,"e":"The supplied exam material places removal of grounds and oils after breaking the crust and before liquoring."},{"q":"When several cuppers share a table, what does the supplied protocol encourage during crust breaking?","o":["One designated person breaks every cup","Each person should be allowed to break at least one cup from as many samples as possible","No one breaks the crust","Only the head cupper may break crusts"],"a":1,"e":"The protocol encourages participants to have the opportunity to break at least one cup from as many samples as possible."},{"q":"When should a cupping spoon be rinsed?","o":["Only after finishing a sample","Before it touches the brew in any cup","Only after a defective cup","Once at the beginning of the table"],"a":1,"e":"The supplied written-exam material specifies rinsing the spoon before it touches the brew in any cup."},{"q":"Liquoring during cupping should continue as the coffee cools to what point?","o":["Only while it is very hot","Until it is below body temperature","Only until crust breaking","Only for five minutes"],"a":1,"e":"The material describes liquoring several times as the coffee cools, including below body temperature."},{"q":"On the 9-point Affective scale, what score corresponds to 'strongly dislike' in the supplied material?","o":["1","3","5","9"],"a":0,"e":"The written-exam material maps strongly dislike to 1."},{"q":"Which phrase is primarily Affective rather than Descriptive?","o":["Low-intensity acidity","Rough mouthfeel","Pleasant aftertaste","Strawberry flavor"],"a":2,"e":"Pleasant expresses a subjective quality judgment, making it Affective."},{"q":"Which phrase is Descriptive rather than Affective?","o":["I strongly like the aroma","Pleasant aftertaste","Low-intensity acidity","Excellent balance"],"a":2,"e":"Low-intensity acidity objectively describes a sensory attribute and its intensity."},{"q":"An importer evaluates one coffee from several buyer perspectives to see which clients it might suit. What approach is this?","o":["Physical grading","Multi-perspective cupping","Quaker testing","Sample roasting"],"a":1,"e":"The supplied exam identifies this as multi-perspective cupping."},{"q":"Which instrument is specified for green-coffee moisture measurement in the Physical Assessment material?","o":["Refractometer","Capacitance-based moisture-content measuring instrument","Agtron spectrophotometer","pH meter"],"a":1,"e":"The study material specifies a capacitance-based moisture-content measuring instrument."},{"q":"What equipment is used to assess green-coffee bean size?","o":["A set of sieves","A refractometer","A cupping spoon","An Agtron tile only"],"a":0,"e":"Bean size is assessed using a set of sieves."},{"q":"Which item is NOT required in the CVA Physical Assessment according to the supplied study sheet?","o":["Color","Defects","Moisture content","Quaker test"],"a":3,"e":"The study sheet explicitly says a Quaker test is not required in Physical Assessment."},{"q":"Does the Physical Assessment color test count and document quakers?","o":["Yes, always","Yes, but only for naturals","No","Only if moisture is high"],"a":2,"e":"The supplied written-exam material states that the color test does not count/document quakers."},{"q":"Why are physical green-coffee defects divided into two categories in the supplied material?","o":["To separate Arabica from Robusta","To distinguish defects with greater visual/sensory impact from those with smaller impact","To separate washed from natural coffee","To distinguish farm defects from roast defects"],"a":1,"e":"The two categories distinguish defects according to their relative visual and sensory impact."},{"q":"For a 200 mL cupping vessel at 5.5 g coffee per 100 mL water, how much coffee is required?","o":["5.5 g","11 g","16.5 g","20 g"],"a":1,"e":"200 mL requires 2 × 5.5 g = 11 g."},{"q":"A 1.5 L batch brew uses 84 g of coffee. What is the brew ratio in g/L?","o":["52 g/L","55 g/L","56 g/L","60 g/L"],"a":2,"e":"84 g ÷ 1.5 L = 56 g/L, which lies within the supplied 55–60 g/L range."},{"q":"Using the midpoint of the supplied 55–60 g/L batch-brew range, how much coffee is needed for 4 L?","o":["220 g","225 g","230 g","240 g"],"a":2,"e":"The midpoint is 57.5 g/L; 57.5 × 4 = 230 g."},{"q":"Which statement about the Affective Assessment is correct?","o":["It includes intensity ratings for every attribute","It records quality and preference using 9-point scales","It replaces Descriptive Assessment","It measures green-bean moisture"],"a":1,"e":"Affective Assessment records subjective quality and preference on 9-point scales."},{"q":"Which statement about Descriptive Assessment is correct?","o":["Its primary purpose is buyer preference scoring","It aims for objective, quantitative sensory description","It records certifications and farm information","It determines green-bean screen size"],"a":1,"e":"Descriptive analysis aims to objectively and quantitatively describe sensory characteristics."},{"q":"Which mouthfeel terms appear in the supplied CATA material?","o":["Oily, Smooth, Mouth-Drying, Rough, Metallic","Floral, Berry, Citrus, Cocoa, Vanilla","Salty, Bitter, Sour, Umami, Sweet","Black, Sour, Parchment, Shell, Floater"],"a":0,"e":"The supplied study sheet lists Oily, Smooth, Mouth-Drying, Rough and Metallic, with examples under some categories."},{"q":"A coffee is described specifically as 'blueberry.' How should that be handled in the supplied descriptive approach?","o":["Record only 'Fruity' and discard blueberry","Use the relevant CATA category and add blueberry as a freely elicited descriptor","Put blueberry on the Extrinsic form","Convert blueberry into an Affective score"],"a":1,"e":"The written-exam example uses the relevant Fruity/Berry CATA category and records blueberry as a freely elicited descriptor."},{"q":"Why is 'Over Fermented' not automatically included as a defect in the supplied Affective material?","o":["Fermentation is never detectable","It is not universally considered unpleasant","It is only a physical defect","It can only occur during roasting"],"a":1,"e":"The study material notes that over-fermented character is not universally regarded as unpleasant."}];
let items=[], answers=[], idx=0, showAnswers=false;
const $=id=>document.getElementById(id);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function begin(){
 showAnswers=document.querySelector('input[name="showAnswers"]:checked').value==="yes";
 items=shuffle(BANK.map(x=>{let oo=x.o.map((t,i)=>({t,correct:i===x.a}));shuffle(oo);return {q:x.q,o:oo,e:x.e}}));
 answers=Array(items.length).fill(null); idx=0; $("intro").classList.add("hidden");$("result").classList.add("hidden");$("quiz").classList.remove("hidden");render();
}
function render(){
 const it=items[idx];
 $("count").textContent=`Question ${idx+1} of ${items.length}`;
 $("answered").textContent=`${answers.filter(x=>x!==null).length} answered`;
 $("bar").style.width=`${((idx+1)/items.length)*100}%`;
 $("question").textContent=it.q;
 const box=$("options"); box.innerHTML="";
 const locked=showAnswers && answers[idx]!==null;
 it.o.forEach((op,k)=>{
   const b=document.createElement("button");
   b.className="option"+(answers[idx]===k?" selected":"");
   b.textContent=op.t;
   if(locked){
     b.disabled=true;
     if(op.correct)b.style.borderColor="var(--good)";
     if(answers[idx]===k&&!op.correct)b.style.borderColor="var(--bad)";
   }
   b.onclick=()=>{if(locked)return;answers[idx]=k;render()};
   box.appendChild(b);
 });
 const fb=$("feedback");
 if(locked){
   const chosen=it.o[answers[idx]], right=it.o.find(x=>x.correct);
   fb.classList.remove("hidden");
   fb.innerHTML=chosen.correct
     ? `<strong class="good">Correct.</strong><br><small>${escapeHtml(it.e)}</small>`
     : `<strong class="bad">Incorrect.</strong><br>Correct answer: <strong>${escapeHtml(right.t)}</strong><br><small>${escapeHtml(it.e)}</small>`;
 } else {
   fb.classList.add("hidden"); fb.innerHTML="";
 }
 $("prev").disabled=idx===0;
 $("next").textContent=idx===items.length-1?"Submit exam":"Next";
}
$("prev").onclick=()=>{if(idx>0){idx--;render()}};
$("next").onclick=()=>{if(idx<items.length-1){idx++;render()}else finish()};
function finish(){
 const unanswered=answers.filter(x=>x===null).length;if(unanswered&&!confirm(`You have ${unanswered} unanswered question(s). Submit anyway?`))return;
 let correct=0;items.forEach((it,i)=>{if(answers[i]!==null&&it.o[answers[i]].correct)correct++});
 const pct=Math.round(correct/items.length*100);$("quiz").classList.add("hidden");$("result").classList.remove("hidden");$("score").textContent=`${correct} / ${items.length} (${pct}%)`;
 $("summary").textContent=pct>=80?"Practice target reached. Review any misses below.":"Review the misses and try another randomized attempt.";
 buildReview();
}
function buildReview(){
 const r=$("review");r.innerHTML="<h2>Answer review</h2>";
 items.forEach((it,i)=>{const chosen=answers[i]===null?null:it.o[answers[i]];const right=it.o.find(x=>x.correct);const d=document.createElement("div");d.className="review";
 d.innerHTML=`<strong>${i+1}. ${escapeHtml(it.q)}</strong><p class="${chosen&&chosen.correct?"good":"bad"}">Your answer: ${chosen?escapeHtml(chosen.t):"Unanswered"}</p>${chosen&&chosen.correct?"":`<p class="good">Correct answer: ${escapeHtml(right.t)}</p>`}<small>${escapeHtml(it.e)}</small>`;r.appendChild(d)});
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$("reviewBtn").onclick=()=>$("review").classList.toggle("hidden");$("retry").onclick=begin;$("start").onclick=begin;
</script></body></html>
