<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Q Grader Practice Mock Exam</title>
<style>
:root{--bg:#f5f1e8;--card:#fff;--ink:#25231f;--muted:#6d675d;--line:#ddd5c8;--accent:#5d4932;--good:#17683a;--bad:#a3362f}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:820px;margin:auto;padding:18px} .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin:12px 0}
h1{font-size:1.75rem;margin:.1rem 0 .5rem} h2{font-size:1.25rem} .muted{color:var(--muted)} .row{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.progress{height:8px;background:#e8e1d6;border-radius:8px;overflow:hidden;margin:14px 0} #bar{height:100%;background:var(--accent);width:0}
button{font:inherit;border:1px solid #bdb3a4;background:white;border-radius:12px;padding:12px 15px;cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.option{width:100%;text-align:left;margin:7px 0} .option.selected{outline:3px solid #c5aa82} .hidden{display:none} .score{font-size:2.2rem;font-weight:750} .good{color:var(--good)} .bad{color:var(--bad)} .review{padding:15px 0;border-top:1px solid var(--line)} small{color:var(--muted)} 
@media(max-width:520px){main{padding:10px}.card{padding:17px}}
</style></head><body><main>
<section id="intro" class="card"><h1>Q Grader Practice Mock Exam</h1><p>40 questions based on the shared course notes and study material.</p><p class="muted">Answer choices are randomized each attempt. After each answer, you’ll immediately see the correct answer and the reason. Your answers stay on your device only.</p><button id="start" class="primary">Start exam</button></section>
<section id="quiz" class="card hidden"><div class="row"><strong id="count"></strong><span id="answered"></span></div><div class="progress"><div id="bar"></div></div><h2 id="question"></h2><div id="options"></div><div class="row" style="margin-top:18px"><button id="prev">Previous</button><button id="next" class="primary">Next</button></div></section>
<section id="result" class="card hidden"><h1>Results</h1><div id="score" class="score"></div><p id="summary"></p><div class="row"><button id="retry" class="primary">Try again</button><button id="reviewBtn">Review answers</button></div><div id="review" class="hidden"></div></section>
</main>
<script>
const BANK=[{"q": "In the CVA framework taught in the course, green-coffee grading corresponds to which assessment?", "o": ["Physical Assessment", "Descriptive Assessment", "Affective Assessment", "Extrinsic Assessment"], "a": 0, "e": "Green grading corresponds to Physical Assessment."}, {"q": "Which CVA assessment objectively describes perceived sensory attributes and their intensity?", "o": ["Affective Assessment", "Extrinsic Assessment", "Descriptive Assessment", "Physical Assessment"], "a": 2, "e": "Descriptive Assessment records sensory description and intensity."}, {"q": "Which CVA assessment records subjective quality and preference?", "o": ["Affective Assessment", "Physical Assessment", "Descriptive Assessment", "Extrinsic Assessment"], "a": 0, "e": "Affective Assessment captures subjective quality and preference."}, {"q": "Which statement best reflects specialty status under the CVA framework?", "o": ["Physical Assessment alone determines it", "Descriptive Assessment alone determines it", "Affective Assessment alone determines it", "No single CVA assessment provides a universal pass/fail specialty threshold"], "a": 3, "e": "The course material does not assign a universal specialty pass/fail threshold to one CVA assessment."}, {"q": "Which sequence matches the cupping attribute order in the instructor material?", "o": ["Fragrance → Aroma → Flavor → Aftertaste → Acidity → Sweetness → Mouthfeel", "Aroma → Fragrance → Flavor → Acidity → Sweetness → Aftertaste → Mouthfeel", "Fragrance → Flavor → Aroma → Acidity → Mouthfeel → Sweetness → Aftertaste", "Flavor → Aroma → Fragrance → Aftertaste → Sweetness → Acidity → Mouthfeel"], "a": 0, "e": "The taught sequence is Fragrance, Aroma, Flavor, Aftertaste, Acidity, Sweetness, Mouthfeel."}, {"q": "What does CATA stand for?", "o": ["Choose Aroma Type and Attribute", "Check All That Apply", "Coffee Attribute Tasting Assessment", "Categorize Aroma, Taste and Acidity"], "a": 1, "e": "CATA means Check All That Apply."}, {"q": "Which descriptive-assessment element does NOT receive an intensity rating in the supplied study material?", "o": ["Aroma", "Acidity", "Mouthfeel", "Main Taste"], "a": 3, "e": "Main Taste is selected/described without an intensity rating."}, {"q": "A Descriptive Assessment records aroma intensity as 14. How should this be interpreted?", "o": ["Low", "Medium", "High", "Affective preference"], "a": 2, "e": "In the supplied material, 14 represents high descriptive intensity."}, {"q": "A Descriptive Assessment records acidity intensity as 8. How should this be interpreted?", "o": ["Low", "Medium", "High", "Defective"], "a": 1, "e": "An intensity of 8 is medium in the course examples."}, {"q": "Which scale pairing is correct?", "o": ["Descriptive 9-point; Affective 15-point", "Descriptive 15-point; Affective 9-point", "Both 9-point", "Both 15-point"], "a": 1, "e": "Descriptive intensity uses 15 points; Affective quality/preference uses 9 points."}, {"q": "During green grading, 12 Partial Black beans represent how many defect equivalents?", "o": ["3", "4", "6", "12"], "a": 1, "e": "Partial Black is 3 beans per defect equivalent: 12 ÷ 3 = 4."}, {"q": "Ten Parchment beans represent how many defect equivalents?", "o": ["1", "2", "5", "10"], "a": 1, "e": "Parchment is 5 beans per defect equivalent: 10 ÷ 5 = 2."}, {"q": "Twenty Slight Insect Damaged beans represent how many defect equivalents?", "o": ["1", "2", "4", "20"], "a": 1, "e": "Slight Insect Damage is 10 beans per defect equivalent: 20 ÷ 10 = 2."}, {"q": "Which defect has multiple black insect holes and an equivalency of 5 beans per defect?", "o": ["Severe Insect Damage", "Slight Insect Damage", "Floater", "Shell"], "a": 0, "e": "Severe Insect Damage has multiple black holes and uses 5 beans per defect equivalent."}, {"q": "Which defect is described as yellow-red mold powder and can contaminate other beans?", "o": ["Full Sour", "Fungus Damaged", "Dried Cherry / Pod", "Hull / Husk"], "a": 1, "e": "Fungus Damaged beans are associated with visible mold powder and possible contamination of neighboring beans."}, {"q": "A bean remains conspicuously light after roasting because it was harvested before fully ripe. Which defect is this?", "o": ["Parchment", "Withered", "Immature / Unripe / Quaker", "Floater"], "a": 2, "e": "Immature/unripe beans may roast lighter and appear as quakers."}, {"q": "Which defect is a raisin-like dried cherry with pulp remaining?", "o": ["Dried Cherry / Pod", "Parchment", "Shell", "Full Sour"], "a": 0, "e": "Dried Cherry / Pod is the raisin-like defect with dried pulp."}, {"q": "Which defect is foreign material such as wood, stone or metal?", "o": ["Hull / Husk", "Foreign Matter", "Shell", "Broken / Chipped / Cut"], "a": 1, "e": "Foreign Matter includes wood, stones, metal and similar non-coffee material."}, {"q": "Six Partial Sour beans, 15 Severe Insect Damaged beans and 10 Hull/Husk pieces equal how many total defect equivalents?", "o": ["6", "7", "8", "31"], "a": 1, "e": "6/3 = 2; 15/5 = 3; 10/5 = 2. Total = 7."}, {"q": "According to the course notes, what deduction is associated with a taint?", "o": ["−1", "−2", "−3", "−4"], "a": 1, "e": "The notes associate a taint with −2."}, {"q": "What deduction is associated with a fault?", "o": ["−1", "−2", "−3", "−4"], "a": 3, "e": "The notes associate a fault with −4."}, {"q": "Which sample-roast duration is within the course standard?", "o": ["5 minutes", "7 minutes", "10 minutes", "15 minutes"], "a": 2, "e": "The course specifies 8–12 minutes."}, {"q": "What are the stated sample-roast Agtron target references for whole and ground coffee?", "o": ["55 whole / 65 ground", "58 whole / 63 ground", "63 whole / 58 ground", "65 whole / 55 ground"], "a": 1, "e": "The notes specify about 58 whole bean and 63 ground, roughly ±1."}, {"q": "Which cooling method follows the sample-roasting notes?", "o": ["Immediate air cooling", "Water quenching", "Slow cooling in the roaster", "Cold-water immersion"], "a": 0, "e": "Samples should be cooled immediately with air; water quenching is excluded."}, {"q": "When should cupping occur after the sample roast according to the notes?", "o": ["Immediately", "2–6 hours", "8–24 hours", "36–48 hours"], "a": 2, "e": "The stated window is 8–24 hours after roasting."}, {"q": "A sample roast is flat, has a baked-bread character, and poorly expresses sweetness and acidity. Which roast fault best fits?", "o": ["Light", "Dark", "Baked", "Fast"], "a": 2, "e": "Baked roasting is associated with insufficient heat over a long roast, flatness, and weak sweetness/acidity."}, {"q": "A sample roast has charcoal, tar, smoky and burnt-sugar characteristics. Which fault best fits?", "o": ["Light", "Dark", "Baked", "Fast"], "a": 1, "e": "These are the instructor-note descriptors for a dark roast fault."}, {"q": "Which sample-roast condition is associated with an Agtron number above 65 in the notes?", "o": ["Too light", "Too dark", "Baked", "Correct target"], "a": 0, "e": "The notes associate >65 with a roast that is too light."}, {"q": "In the Le Nez du Café framework, floral and fruity aromas belong to which formation group?", "o": ["Enzymatic", "Sugar Browning", "Dry Distillation", "Aromatic Taints"], "a": 0, "e": "Floral and fruity aromas are grouped under Enzymatic formation."}, {"q": "Nuts, caramel and chocolate are associated with which aroma-formation group?", "o": ["Enzymatic", "Sugar Browning", "Dry Distillation", "Aromatic Taints"], "a": 1, "e": "Sugar Browning includes Maillard/caramelization-derived nut, caramel and chocolate aromas."}, {"q": "Pyrolytic/burnt, roasted and spicy aromas are associated with which formation group?", "o": ["Enzymatic", "Sugar Browning", "Dry Distillation", "Aromatic Taints"], "a": 2, "e": "Dry Distillation covers stronger thermal breakdown aromas."}, {"q": "Defect aromas arising during production, drying, transportation and storage belong to which group?", "o": ["Enzymatic", "Sugar Browning", "Dry Distillation", "Aromatic Taints"], "a": 3, "e": "Aromatic Taints is the defect-aroma group."}, {"q": "A roasted coffee becomes flat and flavorless after long-term storage as aromatic compounds escape. Which older defect term applies?", "o": ["Insipid", "Vapid", "Past Crop", "Strawy"], "a": 1, "e": "Vapid describes flat, flavorless roasted coffee after long storage and aroma loss through degassing."}, {"q": "A green coffee develops an old, stale taste after long storage following harvest. Which term applies?", "o": ["New Crop", "Past Crop", "Acerbic", "Green"], "a": 1, "e": "Past Crop describes old/stale character from prolonged green-coffee storage."}, {"q": "Brewed coffee held hot too long becomes sour, harsh and astringent. Which term applies?", "o": ["Acerbic", "Woody", "Grassy", "Earthy"], "a": 0, "e": "Acerbic is the term used in the instructor notes for this hot-holding defect."}, {"q": "Which term describes a straw or dried-hay flavor associated with green-coffee storage and aging?", "o": ["Strawy", "Vapid", "Wild", "Flat"], "a": 0, "e": "Strawy is associated with dried-hay character during storage/aging."}, {"q": "Which term describes woody aroma from long-term storage of green coffee?", "o": ["Earthy", "Woody", "Green", "Baked"], "a": 1, "e": "Woody is linked to prolonged green-coffee aging."}, {"q": "For CVA cupping, how should coffee generally be ground?", "o": ["Much finer than espresso", "Espresso-fine", "Slightly coarser than typical paper-filter drip", "Very coarse French-press grind only"], "a": 2, "e": "The exam material specifies slightly coarser than typical paper-filter drip."}, {"q": "At the standard 5.5 g/100 mL cupping ratio, how much coffee is needed for 350 g of water?", "o": ["17.5 g", "18.25 g", "19.25 g", "20.5 g"], "a": 2, "e": "350 × 5.5 / 100 = 19.25 g."}, {"q": "What batch-brew ratio is recommended in the supplied CVA Descriptive Assessment material?", "o": ["45–50 g/L", "50–55 g/L", "55–60 g/L", "65–70 g/L"], "a": 2, "e": "The supplied exam material specifies 55–60 g/L."}];
let items=[], answers=[], idx=0;
const $=id=>document.getElementById(id);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function begin(){
 items=shuffle(BANK.map(x=>{let oo=x.o.map((t,i)=>({t,correct:i===x.a}));shuffle(oo);return {q:x.q,o:oo,e:x.e}}));
 answers=Array(items.length).fill(null); idx=0; $("intro").classList.add("hidden");$("result").classList.add("hidden");$("quiz").classList.remove("hidden");render();
}
function render(){
 const it=items[idx]; $("count").textContent=`Question ${idx+1} of ${items.length}`; $("answered").textContent=`${answers.filter(x=>x!==null).length} answered`;
 $("bar").style.width=`${((idx+1)/items.length)*100}%`; $("question").textContent=it.q; const box=$("options");box.innerHTML="";
 it.o.forEach((op,k)=>{const b=document.createElement("button");b.className="option"+(answers[idx]===k?" selected":"");b.textContent=op.t;b.onclick=()=>{if(answers[idx]===null){answers[idx]=k;render()} };box.appendChild(b)});
 if(answers[idx]!==null){
   const chosen=it.o[answers[idx]], right=it.o.find(x=>x.correct);
   const fb=document.createElement("div"); fb.className="review";
   fb.innerHTML=chosen.correct
     ? `<p class="good"><strong>Correct.</strong> ${escapeHtml(it.e)}</p>`
     : `<p class="bad"><strong>Incorrect.</strong> Correct answer: ${escapeHtml(right.t)}</p><p>${escapeHtml(it.e)}</p>`;
   box.appendChild(fb);
 }
 $("prev").disabled=idx===0; $("next").disabled=answers[idx]===null; $("next").textContent=idx===items.length-1?"Submit exam":"Next";
}
$("prev").onclick=()=>{if(idx>0){idx--;render()}};
$("next").onclick=()=>{if(idx<items.length-1){idx++;render()}else finish()};
function finish(){
 const unanswered=answers.filter(x=>x===null).length;if(unanswered&&!confirm(`You have ${unanswered} unanswered question(s). Submit anyway?`))return;
 let correct=0;items.forEach((it,i)=>{if(answers[i]!==null&&it.o[answers[i]].correct)correct++});
 const pct=Math.round(correct/items.length*100);$("quiz").classList.add("hidden");$("result").classList.remove("hidden");$("score").textContent=`${correct} / ${items.length} (${pct}%)`;
 $("summary").textContent=pct>=80?"Practice target reached. Review any misses below.":"Review the misses and try another randomized attempt.";
 buildReview();
}
function buildReview(){
 const r=$("review");r.innerHTML="<h2>Answer review</h2>";
 items.forEach((it,i)=>{const chosen=answers[i]===null?null:it.o[answers[i]];const right=it.o.find(x=>x.correct);const d=document.createElement("div");d.className="review";
 d.innerHTML=`<strong>${i+1}. ${escapeHtml(it.q)}</strong><p class="${chosen&&chosen.correct?"good":"bad"}">Your answer: ${chosen?escapeHtml(chosen.t):"Unanswered"}</p>${chosen&&chosen.correct?"":`<p class="good">Correct answer: ${escapeHtml(right.t)}</p>`}<small>${escapeHtml(it.e)}</small>`;r.appendChild(d)});
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$("reviewBtn").onclick=()=>$("review").classList.toggle("hidden");$("retry").onclick=begin;$("start").onclick=begin;
</script></body></html>
